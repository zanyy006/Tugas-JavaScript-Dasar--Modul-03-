<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
 
    <!-- External CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
 
    <div class="kalkulator">
 
        <!-- Layar kalkulator -->
        <div class="layar">
            <div class="layar-ekspresi" id="ekspresi"></div>
            <div class="layar-angka" id="angka">0</div>
        </div>
 
        <!-- Tombol-tombol -->
        <div class="tombol-grid">
 
            <!-- Baris 1 -->
            <button class="tombol tombol-hapus" onclick="hapusSemua()">C</button>
            <button class="tombol tombol-hapus" onclick="hapusSatuAngka()">⌫</button>
            <button class="tombol tombol-operator" onclick="inputOperator('%')">%</button>
            <button class="tombol tombol-operator" onclick="inputOperator('/')">÷</button>
 
            <!-- Baris 2 -->
            <button class="tombol" onclick="inputAngka('7')">7</button>
            <button class="tombol" onclick="inputAngka('8')">8</button>
            <button class="tombol" onclick="inputAngka('9')">9</button>
            <button class="tombol tombol-operator" onclick="inputOperator('*')">×</button>
 
            <!-- Baris 3 -->
            <button class="tombol" onclick="inputAngka('4')">4</button>
            <button class="tombol" onclick="inputAngka('5')">5</button>
            <button class="tombol" onclick="inputAngka('6')">6</button>
            <button class="tombol tombol-operator" onclick="inputOperator('-')">−</button>
 
            <!-- Baris 4 -->
            <button class="tombol" onclick="inputAngka('1')">1</button>
            <button class="tombol" onclick="inputAngka('2')">2</button>
            <button class="tombol" onclick="inputAngka('3')">3</button>
            <button class="tombol tombol-operator" onclick="inputOperator('+')">+</button>
 
            <!-- Baris 5 -->
            <button class="tombol tombol-nol" onclick="inputAngka('0')">0</button>
            <button class="tombol" onclick="inputAngka('.')">.</button>
            <button class="tombol tombol-sama" onclick="hitung()">=</button>
 
        </div>
    </div>
 
    <!-- External JavaScript -->
    <script src="assets/javascript.js"></script>
 
</body>
</html>
